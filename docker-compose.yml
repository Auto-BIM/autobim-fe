# 로컬 실행: docker compose up --build  →  API http://localhost:8000/api/docs
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
    volumes: [data:/data]
    depends_on: [redis]
  worker:
    build: ./backend
    command: ["rq", "worker", "convert", "--url", "redis://redis:6379/0"]
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes: [data:/data]   # API와 같은 저장소를 본다 (클라우드에서는 오브젝트 스토리지로 — storage.py)
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  data:
